name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python & JS Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest fastapi httpx pydantic starlette pandas jsonschema h5py

      - name: Run Python test suite
        run: |
          python -m pytest -q tests

      - name: Run Node.js test suite
        env:
          PYTHON: python
          H0_NO_DOM: "1"
        run: |
          node tests/js/run_all.mjs
